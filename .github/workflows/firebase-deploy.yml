# Deploys Hosting + Firestore rules/indexes to Firebase.
# Auth uses Workload Identity Federation (OIDC): GitHub proves who it is to Google, and gets a
# short-lived token. No service-account key is stored anywhere. Setup: docs/FIREBASE_SETUP.md, step 7.
name: Deploy to Firebase
on:
  workflow_dispatch:        # run by hand from the Actions tab
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write           # lets this job request the OIDC token used for Workload Identity Federation
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production # add required reviewers to this environment in repo settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Security rules tests (never deploy rules that fail)
        run: npm run test:rules
      - name: Build
        run: npm run build
        env:
          FIREBASE_WEB_CONFIG: ${{ vars.FIREBASE_WEB_CONFIG }}   # repository variable (public config, not a secret)
      - name: Authenticate to Google Cloud (OIDC, no keys)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy
        run: npx firebase deploy --only hosting,firestore --project "$PROJECT" --non-interactive
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
