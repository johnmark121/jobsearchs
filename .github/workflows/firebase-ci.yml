# Runs on every push and pull request: tests the Firestore security rules in the emulator and
# checks that the Firebase build still finds every anchor in the game code.
name: Firebase CI
on:
  push:
  pull_request:
permissions:
  contents: read            # least privilege: this job only reads the repo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21     # required by the Firestore emulator
      - run: npm ci
      - name: Security rules tests (Firestore emulator)
        run: npm run test:rules
      - name: Emulator build (checks the integration anchors)
        run: npm run build:emulator
